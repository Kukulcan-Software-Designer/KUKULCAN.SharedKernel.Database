name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build and test Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kukulcan_sharedkernel_database_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kukulcan_sharedkernel_database_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUKULCAN_DATABASE_INTEGRATION_CONNECTION_STRING: Host=localhost;Port=5432;Database=kukulcan_sharedkernel_database_integration;Username=postgres;Password=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.Database.slnx

      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.Database.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.Tests/KUKULCAN.SharedKernel.Database.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.Integration/KUKULCAN.SharedKernel.Database.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
