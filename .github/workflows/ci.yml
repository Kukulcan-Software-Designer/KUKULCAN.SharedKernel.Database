name: CI

on:
  push:
    branches:
      - main
      - CI/CD/Auditoria
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test solution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.Database.slnx

      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.Database.slnx --no-restore --configuration Release

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            Tests/KUKULCAN.SharedKernel.Database.Tests/KUKULCAN.SharedKernel.Database.Tests.csproj \
          do
            echo "Running unit tests: ${project}"
            dotnet test "${project}" --no-build --configuration Release --logger "console;verbosity=normal"
          done
