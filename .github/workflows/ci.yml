name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate Database (restore, build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify Docker runtime for integration tests
        run: docker info

      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.Database.slnx

      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.Database.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.Tests/KUKULCAN.SharedKernel.Database.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run SQL Server integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.SQLServer.Integration/KUKULCAN.SharedKernel.Database.SQLServer.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run MySQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.MySQL.Integration/KUKULCAN.SharedKernel.Database.MySQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
