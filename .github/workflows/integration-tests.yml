      - name: Run MySQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Database.MySQL.Integration/KUKULCAN.SharedKernel.Database.MySQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
