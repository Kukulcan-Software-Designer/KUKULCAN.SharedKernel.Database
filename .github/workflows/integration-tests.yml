name: Database Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Docker runtime
        run: docker info

      - name: Restore PostgreSQL integration tests
        run: dotnet restore Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration.csproj

      - name: Build PostgreSQL integration tests
        run: dotnet build Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration.csproj --no-restore --configuration Release

      - name: Run PostgreSQL integration tests with coverage
        run: >-
          dotnet test
          Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration.csproj
          --no-build
          --configuration Release
          --settings Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/coverage.runsettings
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"

      - name: Upload PostgreSQL coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-database-postgresql-coverage
          path: Tests/KUKULCAN.SharedKernel.Database.PostgreSQL.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  sqlserver-integration-tests:
