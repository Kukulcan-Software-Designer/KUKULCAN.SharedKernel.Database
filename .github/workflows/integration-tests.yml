          path: Tests/KUKULCAN.SharedKernel.Database.SQLServer.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  mysql-integration-tests:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
