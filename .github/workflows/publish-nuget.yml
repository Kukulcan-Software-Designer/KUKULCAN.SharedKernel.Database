name: Publish NuGet Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack and publish KUKULCAN.SharedKernel.Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "KUKULCAN.SharedKernel.Database.slnx"

      - name: Build
        run: dotnet build "KUKULCAN.SharedKernel.Database.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "KUKULCAN.SharedKernel.Database.slnx" --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Determine package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$RELEASE_TAG" ]]; then
            echo "Release tag must use the v<version> format."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack "Source/KUKULCAN.SharedKernel.Database/KUKULCAN.SharedKernel.Database.csproj"
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/Kukulcan-Software-Designer/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
