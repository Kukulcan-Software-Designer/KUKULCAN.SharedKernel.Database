services:

  mypostgres:
    image: postgres:16
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - kukulcan-local

  kukulcan-i18n:
    image: kukulcan-i18n:local
    container_name: kukulcan-i18n
    restart: unless-stopped

    depends_on:
      mypostgres:
        condition: service_healthy

    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Kukulcan__Database__Provider: "PostgresSql"
      Kukulcan__Database__ConnectionString: "Host=${POSTGRES_HOST};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Kukulcan__Database__Migration__AutoMigrateOnStartup: "true"
      Kukulcan__Database__Migration__SeedDataOnStartup: "true"
      Jwt__SecretKey: "${KUKULCAN_I18N_JWT_SECRET:?KUKULCAN_I18N_JWT_SECRET must be set when Compose creates kukulcan-i18n}"
      Jwt__Issuer: "ATLAS"
      Jwt__Audience: "ATLAS.i18n"
      ConnectionStrings__Redis: ""

    ports:
      - "8080:8080"

    networks:
      - kukulcan-local

networks:
  kukulcan-local:
    external: true
    name: kukulcan-local

volumes:
  postgres_data:
